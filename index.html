<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Particle Studios</title>
<meta name="description" content="Blue Particle Studios: motion design, launch videos and more.">
<meta name="theme-color" content="#d3d5d9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1013'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232342ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d3d5d9;--ink:#0e1013;--mute:#4a4f57;--blue:#2342ff;--pad:clamp(16px,3.2vw,36px);--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-size:clamp(16px,1vw + 11px,19px);line-height:1.5}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase}
header{padding:18px var(--pad);display:flex;align-items:center;gap:10px;font-stretch:72%;font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:-.02em}
header i{width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(35,66,255,.25)}
main{flex:1;padding:clamp(24px,6vw,90px) var(--pad);max-width:1480px;width:100%;margin:0 auto}
h1{margin:0 0 clamp(28px,5vw,64px);font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:-.035em;line-height:.88;font-size:clamp(46px,11vw,180px)}
h1 em{font-style:normal;color:var(--blue)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
li{border-bottom:1px solid var(--ink)}
a.card{display:grid;gap:6px;padding:22px 0;text-decoration:none;min-height:44px}
a.card:hover strong,a.card:focus-visible strong{color:var(--blue)}
strong{font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:-.025em;font-size:clamp(30px,5vw,72px);line-height:1}
.card span:not(.mono){color:var(--mute);max-width:48ch}
.soon{padding:22px 0;color:var(--mute)}
@media(min-width:760px){a.card{grid-template-columns:1fr 1fr;align-items:end}}
footer{padding:20px var(--pad);border-top:1px solid var(--ink)}
</style>
</head>
<body>
<header><i aria-hidden="true"></i>Blue Particle Studios</header>
<main>
  <p class="mono">[ Studio home ]</p>
  <h1>Things we <em>make.</em></h1>
  <ul>
    <li><a class="card" href="/motion/"><strong>Motion →</strong><span>Launch videos and motion design for apps and startups. Student and startup rates from ₦25,000.</span></a></li>
    <li class="soon mono">More coming soon</li>
  </ul>
</main>
<footer class="mono">© Blue Particle Studios · Abuja, Nigeria</footer>
</body>
</html>
